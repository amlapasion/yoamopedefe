
name: Publicar ultima version en GitHub Pages

on:
  push:
    branches:
      - 'version*'

  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  publicar:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Descargar archivos de la version
        uses: actions/checkout@v4

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Preparar pagina web
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Publicar pagina
        id: deployment
        uses: actions/deploy-pages@v4
