async function addFiles(list,o={}){await wr;const t=S.t,k=t.k;list=[...list];if(!list.length)return;

  try{const bytes=await f.arrayBuffer();const{doc,pw}=await openPdf(bytes,f.name);let fb=bytes,noLib=false;if(pw!=null){try{fb=await decryptPdf(bytes,pw)}catch(e){noLib=true}}
   const F={uid:++uid,name:f.name,bytes:fb,doc,n:doc.numPages,size:f.size,noLib,pw};S.files.push(F);
   if(k=='pages'){const np=[...Array(F.n)].map((_,i)=>({id:++uid,f:F.uid,i,rot:0}));S.pages.splice(pos,0,...np);pos+=np.length}
  }catch(e){err(e.name=='PasswordException'||e.cancel?e:new Error(`No se pudo leer «${f.name}». ¿Está dañado o no es un PDF?`))}}

/* ============ Motor PDF ============ */
async function build(pgs){const out=await D.create(),libs={};let last=[595,842];
 for(let k=0;k<pgs.length;k++){const p=pgs[k];
  if(p.blank)out.addPage(last);else{const f=fileOf(p.f);libs[p.f]??=await D.load(f.bytes,{ignoreEncryption:true});
   const[cp]=await out.copyPages(libs[p.f],[p.i]);cp.setRotation(degrees((cp.getRotation().angle+p.rot)%360));out.addPage(cp);last=[cp.getWidth(),cp.getHeight()]}
  prog((k+1)/pgs.length,`Procesando página ${k+1} de ${pgs.length}…`);if(k%8==7)await tick()}
 return pdfBlob(await out.save({useObjectStreams:true}))}

async function run(){const t=S.t,k=t.k,B=$('#go');B.disabled=true;setRes([]);
 try{
 if(k!='txt2pdf'&&!S.files.length)throw new Error(IMGK.includes(k)?'Añade al menos una imagen.':'Primero añade un archivo.');
 const nm=base(S.files[0]&&S.files[0].name);
 if(S.files.some(f=>f.noLib)&&!['toimg','pdf2txt','pdf2docx','pdf2xlsx','pdf2pptx'].includes(k))throw new Error('Este PDF usa un tipo de cifrado que esta herramienta no puede procesar localmente (solo se admite AES-256). Puedes verlo y convertirlo a imágenes, texto, Word, Excel o PowerPoint; para las demás herramientas hay que quitarle antes la contraseña con tu programa habitual.');
 if(X[k]){await X[k]();return}
 if(k=='pages'){let pg=S.pages,id=t.id;
  if(id=='merge'&&S.files.length<2)throw new Error('Añade al menos dos PDF para unirlos.');
  if(id=='extract'){pg=pg.filter(p=>S.sel.has(p.id));if(!pg.length)throw new Error('Marca las páginas que quieres extraer.')}
  if(id=='delete'){if(!S.sel.size)throw new Error('Marca las páginas que quieres eliminar.');pg=pg.filter(p=>!S.sel.has(p.id));if(!pg.length)throw new Error('No puedes eliminar todas las páginas.')}
  if(!pg.length)throw new Error('No hay páginas en el documento.');
  setRes([{name:`${nm}_${t.out}.pdf`,blob:await build(pg)}])}
 else if(k=='split'){const F=S.files[0],m=$('#o_m').value,v=$('#o_v').value;let g=[];
  if(m=='o')g=[...Array(F.n)].map((_,i)=>[i]);
  else if(m=='n'){const n=Math.floor(+v);if(!(n>=1))throw new Error('Escribe un número N válido (1 o más).');for(let i=0;i<F.n;i+=n)g.push([...Array(Math.min(n,F.n-i))].map((_,j)=>i+j))}
  else g=pr(v,F.n);
  if(!g.length)throw new Error('Indica al menos un intervalo, por ejemplo 1-3, 4-6.');
  const r=[];for(let x=0;x<g.length;x++){const lab=g[x].length>1?`${g[x][0]+1}-${g[x].at(-1)+1}`:`${g[x][0]+1}`;
   r.push({name:`${nm}_${lab}.pdf`,blob:await build(g[x].map(i=>({f:F.uid,i,rot:0})))});prog((x+1)/g.length)}setRes(r)}
 else if(k=='toimg'){const sc=+$('#o_s').value,q=+$('#o_q').value,r=[];let tot=S.files.reduce((a,f)=>a+f.n,0),d=0;
  for(const F of S.files)for(let i=0;i<F.n;i++){const p=await F.doc.getPage(i+1),v=p.getViewport({scale:sc}),c=H('canvas');c.width=v.width;c.height=v.height;
   const cx=c.getContext('2d');if(t.fmt=='jpeg'){cx.fillStyle='#fff';cx.fillRect(0,0,c.width,c.height)}
   await p.render({canvasContext:cx,viewport:v}).promise;
   r.push({name:`${base(F.name)}_p${String(i+1).padStart(3,'0')}.${t.ext}`,blob:await cvBlob(c,'image/'+t.fmt,q)});prog(++d/tot,`Página ${d} de ${tot}…`);await tick()}
  setRes(r)}
 else if(k=='pdf2txt'){const r=[];for(const F of S.files){let tx='';
   for(let i=1;i<=F.n;i++){const c=await(await F.doc.getPage(i)).getTextContent();tx+=`--- Página ${i} ---\n`+c.items.map(s=>s.str+(s.hasEOL?'\n':'')).join('')+'\n\n';prog(i/F.n,`${F.name}: página ${i} de ${F.n}…`);if(i%10==0)await tick()}
   r.push({name:base(F.name)+'.txt',blob:new Blob([tx],{type:'text/plain;charset=utf-8'}),note:tx.replace(/--- Página \d+ ---|\s/g,'')?'':'sin texto (¿PDF escaneado? no hay OCR)'})}
  setRes(r)}
 else if(k=='meta'){const F=S.files[0],d=await D.load(F.bytes,{ignoreEncryption:true,updateMetadata:false}),v=i=>$('#m_'+i).value;
  d.setTitle(v('t'));d.setAuthor(v('a'));d.setSubject(v('s'));d.setKeywords(v('k').split(',').map(s=>s.trim()).filter(Boolean));d.setCreator(v('c'));d.setProducer(v('p'));
  setRes([{name:nm+'_metadatos.pdf',blob:pdfBlob(await d.save())}])}
 }finally{B.disabled=false}}

<label>Resolución de lectura<select id="o_dp"><option value="150">150 ppp (rápido)</option><option value="200" selected>200 ppp</option><option value="300">300 ppp (más preciso, lento)</option></select></label>
<label><span><input type="checkbox" id="o_fo"> Forzar OCR también en páginas que ya tienen texto</span></label>
<p class="muted" style="grid-column:1/-1">Se reconocen las páginas sin texto (escaneadas). El PDF original se conserva intacto y se le añade una capa de texto invisible, seleccionable y buscable. La primera vez se descargan el motor y el idioma (unos MB) desde un CDN público; <b>tu documento no sale del navegador</b>. Solo idiomas con alfabeto latino.</p>`;
X.ocr=async()=>{const T=await lib(TESS_URL,'Tesseract'),F=S.files[0],lang=$('#o_lg').value,dpi=+$('#o_dp').value,force=$('#o_fo').checked,todo=[];
 const d=await D.load(F.bytes,{ignoreEncryption:true,updateMetadata:false}),ft=await d.embedFont(SF.Helvetica),pgs=d.getPages();
 for(let i=1;i<=F.n;i++){const tc=await(await F.doc.getPage(i)).getTextContent();if(force||tc.items.reduce((a,s)=>a+s.str.trim().length,0)<15)todo.push(i)}

 let done=0,nw=0,conf=0,skip=0;$('#st').textContent='Preparando el motor OCR (primera vez: descarga del idioma)…';
 const w=await T.createWorker(lang,1,{logger:m=>{if(m.status=='recognizing text')prog((done+m.progress)/todo.length,`OCR: página ${todo[Math.min(done,todo.length-1)]} (${done+1} de ${todo.length}) · ${Math.round(m.progress*100)}%`)}});
 try{for(const i of todo){const p=await F.doc.getPage(i);if(p.rotate){skip++;done++;continue}
   const s=dpi/72,c=await pageCv(p,s),{data}=await w.recognize(c,{},{blocks:true}),[,,,top]=p.view,[x0]=p.view,pg=pgs[i-1];
   const words=data.words||(data.blocks||[]).flatMap(b=>b.paragraphs.flatMap(q=>q.lines.flatMap(l=>l.words)));
   pg.pushOperators(PDFLib.pushGraphicsState(),PDFLib.setTextRenderingMode(PDFLib.TextRenderingMode.Invisible));
   for(const wd of words){const t=clean(wd.text||'').trim();if(!t)continue;const b=wd.bbox,wp=(b.x1-b.x0)/s,hp=(b.y1-b.y0)/s,w1=ft.widthOfTextAtSize(t,1);
    pg.drawText(t+' ',{x:b.x0/s+x0,y:top-b.y1/s+hp*.2,size:Math.max(2,Math.min(wp/w1,hp*1.1)),font:ft});nw++}
   pg.pushOperators(PDFLib.popGraphicsState());conf+=data.confidence||0;done++;prog(done/todo.length,`Página ${i} reconocida (${done} de ${todo.length})`);c.width=c.height=0;await tick()}
 }finally{await w.terminate()}
 if(!nw)throw new Error('El OCR no reconoció texto en las páginas procesadas. Prueba con más resolución o con otro idioma.');

   (sin compresión, PackBits, LZW, Deflate; 1 u 8 bits; gris, RGB, RGBA, paleta) y, si no puede, el del navegador (Safari). */

  if(m==0xE1&&u[p+4]==69&&u[p+5]==120){const t=p+10,le=u[t]==73,r16=o=>le?u[o]|(u[o+1]<<8):(u[o]<<8)|u[o+1],r32=o=>le?(u[o]|(u[o+1]<<8)|(u[o+2]<<16)|(u[o+3]<<24)):((u[o]<<24)|(u[o+1]<<16)|(u[o+2]<<8)|u[o+3]),ifd=t+r32(t+4),n=r16(ifd);

X.imgconv=async()=>{const fmt=$('#o_of').value,q=+$('#o_q').value,bg=$('#o_bg').value,r=[],used={};
 for(let i=0;i<S.files.length;i++){const f=S.files[i];let its;try{its=await loadImgs(f,true)}catch(e){throw new Error(`«${f.name}»: ${e.message}`)}
  for(const it of its){const cv=it.cv||bmCanvas(it.bm);it.bm&&it.bm.close();let b;
   if(fmt=='png')b=await cvBlob(cv,'image/png');
   else if(fmt=='webp'){b=await cvBlob(cv,'image/webp',q);if(!b||b.type!='image/webp')throw new Error('Este navegador no puede crear WEBP.')}
   else if(fmt=='jpg')b=await cvBlob(flat(cv,bg),'image/jpeg',q);
   else if(fmt=='bmp')b=encBmp(cv,bg);else b=encTiff(cv,hasAlpha(cv));
   let nm=`${it.name}.${fmt}`;if(used[nm]){nm=`${it.name}_${used[nm]+1}.${fmt}`}used[`${it.name}.${fmt}`]=(used[`${it.name}.${fmt}`]||0)+1;
   r.push({name:nm,blob:b,note:`${cv.width}×${cv.height} px`});c0(cv)}
  prog((i+1)/S.files.length,`Imagen ${i+1} de ${S.files.length}…`);await tick()}
 setRes(r)};
const c0=c=>{c.width=c.height=0};

/* ---------- Audio: decodifica el navegador; salida WAV (PCM) y FLAC (codificador propio) ---------- */
const AUD_ACC='audio/*,.mp3,.wav,.aac,.flac,.ogg,.oga,.opus,.m4a';
const isAudioFile=f=>/^audio\//.test(f.type)||/\.(mp3|wav|aac|flac|ogg|oga|opus|m4a)$/i.test(f.name);
function probeRate(u){const le=o=>u[o]|(u[o+1]<<8)|(u[o+2]<<16)|((u[o+3]<<24)>>>0);
 if(u[0]==82&&u[1]==73&&u[2]==70&&u[3]==70)return le(24);
 if(u[0]==102&&u[1]==76&&u[2]==97&&u[3]==67)return(u[18]<<12)|(u[19]<<4)|(u[20]>>4);
 if(u[0]==79&&u[1]==103&&u[2]==103&&u[3]==83){const s=String.fromCharCode(...u.subarray(0,Math.min(u.length,400)));if(s.includes('OpusHead'))return 48000;const i=s.indexOf('\x01vorbis');return i>=0?le(i+12):0}
 if(u[4]==102&&u[5]==116&&u[6]==121&&u[7]==112){for(let i=0;i<u.length-40;i++)if(u[i]==109&&u[i+1]==112&&u[i+2]==52&&u[i+3]==97)return(u[i+28]<<8)|u[i+29];return 0}
 if(u[0]==255&&(u[1]&0xF6)==0xF0)return[96000,88200,64000,48000,44100,32000,24000,22050,16000,12000,11025,8000,7350][(u[2]>>2)&15]||0;
 let p=0;if(u[0]==73&&u[1]==68&&u[2]==51)p=10+(((u[6]&127)<<21)|((u[7]&127)<<14)|((u[8]&127)<<7)|(u[9]&127));
 for(let i=p;i<u.length-4&&i<p+4096;i++)if(u[i]==255&&(u[i+1]&0xE0)==0xE0){const v=(u[i+1]>>3)&3,sr=(u[i+2]>>2)&3;if(v!=1&&sr!=3&&((u[i+1]>>1)&3)!=0)return({3:[44100,48000,32000],2:[22050,24000,16000],0:[11025,12000,8000]})[v][sr]}
 return 0}
const AUDIO_CAP=()=>{const a=document.createElement('audio'),t=m=>a.canPlayType(m)?'✓':'✗';return`MP3 ${t('audio/mpeg')} · WAV ${t('audio/wav')} · OGG ${t('audio/ogg; codecs="vorbis"')} · FLAC ${t('audio/flac')} · AAC/M4A ${t('audio/mp4; codecs="mp4a.40.2"')}`};
O.audioconv=()=>`<label>Convertir a<select id="o_af"><option value="wav">WAV (PCM sin pérdida)</option><option value="flac">FLAC (sin pérdida, comprimido)</option></select></label>
<label>Profundidad<select id="o_ab"><option value="16">16 bits</option><option value="24">24 bits</option></select></label>
<label>Frecuencia de muestreo<select id="o_ar"><option value="0">Original</option><option value="48000">48000 Hz</option><option value="44100">44100 Hz</option><option value="32000">32000 Hz</option><option value="22050">22050 Hz</option><option value="16000">16000 Hz</option><option value="8000">8000 Hz</option></select></label>
<label>Canales<select id="o_ac"><option value="0">Originales</option><option value="1">Mono</option><option value="2">Estéreo</option></select></label>
<p class="muted" style="grid-column:1/-1">Lectura de audio en este navegador: ${AUDIO_CAP()}. Solo se pueden abrir los formatos marcados con ✓ (los decodifica el propio navegador; AAC/M4A dependen del navegador). Las salidas MP3, AAC, OGG y M4A y todo el vídeo no están disponibles: exigirían FFmpeg.wasm (≈31 MB de descarga, muy lento y sin multihilo en un archivo local). Convertir a 24 bits desde una fuente de 16 no añade calidad.</p>`;
const u8s=(dv,o,s)=>{for(let i=0;i<s.length;i++)dv.setUint8(o+i,s.charCodeAt(i))};
function encWav(chs,rate,bits){const n=chs[0].length,c=chs.length,bp=bits/8,data=n*c*bp,u=new Uint8Array(44+data),dv=new DataView(u.buffer),mx=2**(bits-1);
 u8s(dv,0,'RIFF');dv.setUint32(4,36+data,true);u8s(dv,8,'WAVEfmt ');dv.setUint32(16,16,true);dv.setUint16(20,1,true);dv.setUint16(22,c,true);dv.setUint32(24,rate,true);dv.setUint32(28,rate*c*bp,true);dv.setUint16(32,c*bp,true);dv.setUint16(34,bits,true);u8s(dv,36,'data');dv.setUint32(40,data,true);
 let o=44;for(let i=0;i<n;i++)for(let k=0;k<c;k++){const v=Math.max(-mx,Math.min(mx-1,Math.round(chs[k][i]*mx)));if(bits==16){dv.setInt16(o,v,true);o+=2}else{u[o++]=v&255;u[o++]=(v>>8)&255;u[o++]=(v>>16)&255}}
 return new Blob([u],{type:'audio/wav'})}
const CRC8=(()=>{const t=new Uint8Array(256);for(let i=0;i<256;i++){let c=i;for(let k=0;k<8;k++)c=c&128?((c<<1)^7)&255:(c<<1)&255;t[i]=c}return t})(),CRC16=(()=>{const t=new Uint16Array(256);for(let i=0;i<256;i++){let c=i<<8;for(let k=0;k<8;k++)c=c&32768?((c<<1)^0x8005)&65535:(c<<1)&65535;t[i]=c}return t})();
/* Codificador FLAC: bloques de 4096, subtramas CONSTANT / FIXED (orden 0-4, Rice con particiones) / VERBATIM; canales independientes */
function encFlac(chs,rate,bits){const n=chs[0].length,c=chs.length,B=4096;let buf=new Uint8Array(1<<20),bp=0,acc=0,an=0;
 const put=b=>{if(bp==buf.length){const t=new Uint8Array(buf.length*2);t.set(buf);buf=t}buf[bp++]=b};
 const wb=(v,k)=>{while(k>0){const take=Math.min(k,8-an),sh=k-take;acc=(acc<<take)|(Math.floor(v/2**sh)%2**take);an+=take;k-=take;v=v%2**sh;if(an==8){put(acc&255);acc=0;an=0}}};
 const un=q=>{while(q>0){const z=Math.min(q,8-an);acc<<=z;an+=z;q-=z;if(an==8){put(acc&255);acc=0;an=0}}wb(1,1)};
 const sw=(v,k)=>wb(v<0?v+2**k:v,k);
 put(102);put(76);put(97);put(67);wb(1,1);wb(0,7);wb(34,24);wb(Math.max(16,Math.min(B,n)),16);wb(B,16);wb(0,24);wb(0,24);wb(rate,20);wb(c-1,3);wb(bits-1,5);wb(n,36);for(let i=0;i<16;i++)put(0);
 const resid=(x,o)=>{const L=x.length,r=new Array(L-o);for(let i=o;i<L;i++){const a=x[i];r[i-o]=o==0?a:o==1?a-x[i-1]:o==2?a-2*x[i-1]+x[i-2]:o==3?a-3*x[i-1]+3*x[i-2]-x[i-3]:a-4*x[i-1]+6*x[i-2]-4*x[i-3]+x[i-4]}return r};
 const zz=v=>v>=0?2*v:-2*v-1;
 const plan=(r,L,o)=>{let best=null;for(let po=0;po<=8;po++){const P=1<<po;if(L%P||(L>>po)<=o)break;const parts=[];let bits_=6,pos=0;
   for(let j=0;j<P;j++){const m=(L>>po)-(j==0?o:0);let s=0;for(let i=0;i<m;i++)s+=zz(r[pos+i]);let bk=0,bc=1e18;for(let k=0;k<=30;k++){const cst=m*(k+1)+Math.floor(s/2**k);if(cst<bc){bc=cst;bk=k}}parts.push([bk,m]);bits_+=5+bc;pos+=m}
   if(!best||bits_<best.bits)best={po,parts,bits:bits_}}return best};
 const sub=x=>{const L=x.length;let constant=true;for(let i=1;i<L;i++)if(x[i]!==x[0]){constant=false;break}
  if(constant){wb(0,1);wb(0,6);wb(0,1);sw(x[0],bits);return}
  let bo=-1,bp_=null,bb=8+L*bits;
  for(let o=0;o<=4&&o<L;o++){const r=resid(x,o),p=plan(r,L,o);if(!p)continue;const tot=o*bits+2+4+p.bits;if(tot<bb){bb=tot;bo=o;bp_={p,r}}}
  if(bo<0){wb(0,1);wb(1,6);wb(0,1);for(let i=0;i<L;i++)sw(x[i],bits);return}
  wb(0,1);wb(8+bo,6);wb(0,1);for(let i=0;i<bo;i++)sw(x[i],bits);wb(1,2);wb(bp_.p.po,4);let pos=0;
  for(const[k,m]of bp_.p.parts){wb(k,5);for(let i=0;i<m;i++){const u=zz(bp_.r[pos+i]);un(Math.floor(u/2**k));if(k)wb(u%2**k,k)}pos+=m}};
 const u8=(fn)=>{if(fn<128)wb(fn,8);else if(fn<2048){wb(0xC0|(fn>>6),8);wb(0x80|(fn&63),8)}else if(fn<65536){wb(0xE0|(fn>>12),8);wb(0x80|((fn>>6)&63),8);wb(0x80|(fn&63),8)}else{wb(0xF0|(fn>>18),8);wb(0x80|((fn>>12)&63),8);wb(0x80|((fn>>6)&63),8);wb(0x80|(fn&63),8)}};
 for(let s=0,fn=0;s<n;s+=B,fn++){const L=Math.min(B,n-s),st=bp;wb(0xFFF8,16);const bc=L==4096?12:(L<=256?6:7);wb(bc,4);wb(0,4);wb(c-1,4);wb(0,3);wb(0,1);u8(fn);if(bc==6)wb(L-1,8);else if(bc==7)wb(L-1,16);
  let cr=0;for(let i=st;i<bp;i++)cr=CRC8[cr^buf[i]];put(cr);
  for(let k=0;k<c;k++)sub(chs[k].subarray(s,s+L));
  if(an>0)wb(0,8-an);let c16=0;for(let i=st;i<bp;i++)c16=((c16<<8)&65535)^CRC16[(c16>>8)^buf[i]];put(c16>>8);put(c16&255)}

X.audioconv=async()=>{const fmt=$('#o_af').value,bits=+$('#o_ab').value,tr=+$('#o_ar').value,tc=+$('#o_ac').value,r=[],used={};
 for(let i=0;i<S.files.length;i++){const f=S.files[i];prog(i/S.files.length,`Decodificando ${f.name}…`);await tick();
  const u=new Uint8Array(f.bytes),pr=probeRate(u),rate=tr||pr||44100;let ab;
  try{ab=await new OfflineAudioContext(2,1,rate).decodeAudioData(f.bytes.slice(0))}catch(e){throw new Error(`«${f.name}»: tu navegador no puede decodificar este audio (${AUDIO_CAP()}).`)}
  let chs=[...Array(ab.numberOfChannels).keys()].map(k=>ab.getChannelData(k));
  if(tc==1&&chs.length>1){const m=new Float32Array(ab.length);for(let j=0;j<m.length;j++){let s=0;for(const c of chs)s+=c[j];m[j]=s/chs.length}chs=[m]}
  else if(tc==2){if(chs.length==1)chs=[chs[0],chs[0]];else if(chs.length>2)chs=chs.slice(0,2)}
  prog((i+.5)/S.files.length,`Codificando ${fmt.toUpperCase()}…`);await tick();
  let blob;if(fmt=='wav')blob=encWav(chs,ab.sampleRate,bits);else{const mx=2**(bits-1),ic=chs.map(c=>{const o=new Int32Array(c.length);for(let j=0;j<c.length;j++)o[j]=Math.max(-mx,Math.min(mx-1,Math.round(c[j]*mx)));return o});blob=encFlac(ic,ab.sampleRate,bits)}
  let nm=base(f.name)+'.'+fmt;if(used[nm])nm=base(f.name)+'_'+(used[nm]+1)+'.'+fmt;used[base(f.name)+'.'+fmt]=(used[base(f.name)+'.'+fmt]||0)+1;
  r.push({name:nm,blob,note:`${ab.sampleRate} Hz · ${chs.length} canal(es) · ${bits} bits · ${ab.duration.toFixed(1)} s${tr==0&&!pr?' · frecuencia original no legible: se usó 44100 Hz':''}`});await tick()}
 setRes(r)};

/* ============ Reorganización de la página principal, buscador y navegación ============ */

 merge:'c',split:'c',extract:'c',delete:'c',reorder:'c',rotate:'c',dup:'c',insert:'c',blank:'c',organize:'c',compress:'c',wm:'c',num:'c',meta:'c',view:'c',protect:'d',sign:'d',ocr:'e',ocrimg:'e',imgconv:'f',audioconv:'f'};

T.forEach(t=>{const c=CATS.find(x=>x[0]==CATMAP[t.id]);if(!c)throw new Error('Herramienta sin categoría: '+t.id);t.c=c[1]});

const norm=s=>s.normalize('NFD').replace(/[\u0300-\u036f]/g,'').toLowerCase();
function home(){S={};const ws=norm($('#q').value.trim()).split(/\s+/).filter(Boolean),m=$('#main');m.replaceChildren();let tot=0;
 const secs=CATS.map(([k,name,ic])=>{const ts=T.filter(t=>t.c==name&&ws.every(w=>norm(`${t.n} ${t.d} ${KW[t.id]||''} ${name}`).includes(w)));tot+=ts.length;return[k,name,ic,ts]}).filter(s=>s[3].length);

 for(const[k,name,ic,ts]of secs)m.append(H('section',{id:'cat_'+k,class:'cat'},H('h2',{},ic+' '+name,H('small',{},String(ts.length))),H('div',{class:'tools'},...ts.map(t=>H('button',{class:'tool',onclick:()=>openTool(t.id)},H('i',{},t.i),H('b',{},t.n),H('span',{},t.d))))))}
$('#q').oninput=()=>{if(S.t&&history.state&&history.state.tool)history.replaceState({},'',location.pathname+location.search);home()};

{const id=location.hash.slice(1);if(T.some(t=>t.id==id)){history.replaceState({tool:id,deep:1},'');renderTool(id)}else{history.replaceState({},'');home()}}
/* Botón flotante «subir» y altura de la cabecera para los accesos rápidos */
{const up=$('#up'),hh=()=>document.documentElement.style.setProperty('--hh',$('header').offsetHeight+'px');hh();addEventListener('resize',hh);
